<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <title>Gemini Word Chat</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <link rel="stylesheet" href="taskpane.css">
</head>
<body>
<div class="container">

    <div id="status" class="status">Khởi tạo...</div>

    <div id="upload-progress-container" class="spinner-container d-none">
        <div id="upload-progress-bar" class="spinner-bar"></div>
        <span id="upload-progress-text"></span>
    </div>

    <section class="panel">
        <h3>Upload Tài liệu</h3>
        <p>Hệ thống tự động upload toàn bộ tài liệu khi mở Add-in. Nhấn nút để upload lại.</p>
        <button id="index-button">Upload Tài liệu</button>
    </section>

    <section class="panel chat-panel">
        <div id="chat-container"></div>
        <div id="chat-input-container">
            <textarea id="chat-input" placeholder="Nhập câu hỏi..." rows="2"></textarea>
            <button id="chat-send-btn">Gửi</button>
        </div>
    </section>

</div>

<script src="taskpane.js" type="text/javascript"></script>
</body>
</html>
